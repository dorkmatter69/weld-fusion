[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weldfusion"
version = "0.1.0"
description = "Multimodal weld-defect case study: loader, alignment and MCAP conversion"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mcap>=1.1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
sim = ["mujoco", "pyads"]
research = ["torch>=2.2", "sentence-transformers[image,audio,video]>=6.1", "scikit-learn>=1.4"]

[project.scripts]
weldfusion = "weldfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
